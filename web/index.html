<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KORT · Corte láser y plegado CNC</title>
<link rel="stylesheet" href="/web/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231b3a5c'/><path d='M24 22h14v24l20-24h17L52 48l24 30H58L38 52v26H24z' fill='%23e4572e'/></svg>">

<!-- OrbitControls importa "three" como especificador desnudo: el mapa lo
     resuelve al archivo local. Todo se sirve desde esta máquina, sin CDN. -->
<script type="importmap">
{
  "imports": {
    "three": "/lib/three.module.js",
    "three/webgpu": "/lib/three.module.js",
    "three/tsl": "/lib/three.module.js"
  }
}
</script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 100 100" class="logo"><rect width="100" height="100" rx="18" fill="#1b3a5c"/><path d="M24 22h14v24l20-24h17L52 48l24 30H58L38 52v26H24z" fill="#e4572e"/></svg>
    <div>
      <strong>KORT</strong>
      <span>Corte láser · Plegado CNC</span>
    </div>
  </div>
  <nav id="nav"></nav>
  <div class="topbar-acciones">
    <button class="btn-icono" id="btn-tema" title="Cambiar tema">◐</button>
    <span class="chip" id="chip-estado">Listo</span>
  </div>
</header>

<main id="vista"></main>

<div id="toasts"></div>
<div id="modal-fondo" class="modal-fondo oculto"><div id="modal" class="modal"></div></div>

<script type="module" src="/web/js/app.js"></script>
</body>
</html>
